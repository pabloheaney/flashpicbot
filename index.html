<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bot公告與狀態</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .status-card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #2ecc71;
            margin-right: 8px;
        }

        .status-text {
            font-weight: bold;
            font-size: 1.2em;
        }

        .announcement {
            border-bottom: 1px solid var(--tg-theme-hint-color, #ccc);
            padding: 15px 0;
        }

        .date {
            font-size: 0.85em;
            color: var(--tg-theme-hint-color, #888);
            margin-bottom: 5px;
        }

        .title {
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        h2 {
            font-size: 1.1em;
            color: var(--tg-theme-link-color, #2481cc);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="status-card">
        <span class="status-indicator"></span>
        <span class="status-text">Bot運作正常</span>
        <div style="font-size: 0.9em; margin-top: 5px; opacity: 0.8;">所有服務皆運作正常</div>
    </div>

    <h2>最新公告</h2>
    <div id="announcements">
        <div class="announcement">
            <div class="date">2026-01-30</div>
            <span class="title">訂閲群組通知</span>
            <div>鯛魚燒，無名小站，小葵等車谷暫時無法備份。歡迎聯絡客服提供以上群組邀請連結以協助恢復BOT備份功能，首位提供邀請連結的用戶可獲10日高級VIP。</div>
        </div>
        
        <div class="announcement">
            <div class="date">2026-01-30</div>
            <span class="title">新功能上線</span>
            <div>用戶可透過此Mini App檢查Bot運作狀態及管理員公告。（點擊右上角菜單Reload Page更新頁面）</div>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;

    tg.ready();

    tg.expand();

    tg.MainButton.setText("關閉");
    tg.MainButton.show();
    tg.MainButton.onClick(function(){
        tg.close();
    });
</script>

</body>
</html>
