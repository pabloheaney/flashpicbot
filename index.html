<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App 公告與狀態</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* 基礎樣式：使用 Telegram 提供的 CSS 變數來適應主題 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* 狀態卡片 */
        .status-card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #2ecc71; /* 綠色代表正常 */
            margin-right: 8px;
        }

        .status-text {
            font-weight: bold;
            font-size: 1.2em;
        }

        /* 公告列表 */
        .announcement {
            border-bottom: 1px solid var(--tg-theme-hint-color, #ccc);
            padding: 15px 0;
        }

        .date {
            font-size: 0.85em;
            color: var(--tg-theme-hint-color, #888);
            margin-bottom: 5px;
        }

        .title {
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        h2 {
            font-size: 1.1em;
            color: var(--tg-theme-link-color, #2481cc);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="status-card">
        <span class="status-indicator"></span>
        <span class="status-text">系統運作正常</span>
        <div style="font-size: 0.9em; margin-top: 5px; opacity: 0.8;">所有服務皆在線上</div>
    </div>

    <h2>最新公告</h2>
    <div id="announcements">
        <div class="announcement">
            <div class="date">2023-10-27</div>
            <span class="title">系統維護完成通知</span>
            <div>我們已完成伺服器升級，連線速度現已提升 20%。</div>
        </div>
        
        <div class="announcement">
            <div class="date">2023-10-25</div>
            <span class="title">新功能上線</span>
            <div>現在支援深色模式自動切換囉！</div>
        </div>
    </div>
</div>

<script>
    // 初始化 Telegram Web App
    const tg = window.Telegram.WebApp;

    // 通知 Telegram App 網頁已準備好
    tg.ready();

    // 擴展主視窗以獲得更好的視覺體驗
    tg.expand();

    // 設定主按鈕 (底部大按鈕) - 點擊可關閉視窗
    tg.MainButton.setText("關閉");
    tg.MainButton.show();
    tg.MainButton.onClick(function(){
        tg.close();
    });
</script>

</body>
</html>
