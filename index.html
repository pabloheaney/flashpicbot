<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bot公告與狀態</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* 狀態卡片樣式 */
        .status-card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ccc;
            margin-right: 8px;
        }

        .status-text {
            font-weight: bold;
            font-size: 1.2em;
        }

        /* 公告列表樣式 */
        .announcement {
            border-bottom: 1px solid var(--tg-theme-hint-color, #ccc);
            padding: 15px 0;
            animation: fadeIn 0.5s ease;
        }

        .announcement:last-child {
            border-bottom: none;
        }

        .date {
            font-size: 0.85em;
            color: var(--tg-theme-hint-color, #888);
            margin-bottom: 5px;
        }

        .title {
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
            font-size: 1.05em;
        }

        h2 {
            font-size: 1.1em;
            color: var(--tg-theme-link-color, #2481cc);
            border-bottom: 2px solid var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding-bottom: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        #loading {
            text-align: center;
            color: var(--tg-theme-hint-color, #888);
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="status-card" id="status-card" style="display:none;">
        <span class="status-indicator" id="status-indicator"></span>
        <span class="status-text" id="status-text">載入中...</span>
        <div id="status-subtext" style="font-size: 0.9em; margin-top: 5px; opacity: 0.8;"></div>
    </div>

    <h2>最新公告</h2>
    
    <div id="loading">載入資料中...</div>

    <div id="announcements"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();
    
    tg.MainButton.setText("關閉");
    tg.MainButton.show();
    tg.MainButton.onClick(function(){
        tg.close();
    });

    async function loadData() {
        try {
            const response = await fetch('data.json?t=' + new Date().getTime());
            
            if (!response.ok) {
                throw new Error('無法讀取資料');
            }

            const data = await response.json();
            renderPage(data);

        } catch (error) {
            console.error('Error loading data:', error);
            document.getElementById('loading').innerText = "無法載入公告，請稍後再試。";
        }
    }

    function renderPage(data) {
        const statusCard = document.getElementById('status-card');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const statusSubtext = document.getElementById('status-subtext');

        if (data.botStatus) {
            statusText.innerText = data.botStatus.text;
            statusSubtext.innerText = data.botStatus.subText;
            statusIndicator.style.backgroundColor = data.botStatus.color || '#2ecc71';
            statusCard.style.display = 'block';
        }

        const announcementsContainer = document.getElementById('announcements');
        const loadingDiv = document.getElementById('loading');
        
        announcementsContainer.innerHTML = '';
        loadingDiv.style.display = 'none';

        if (data.announcements && data.announcements.length > 0) {
            data.announcements.forEach(item => {
                const contentHtml = item.content.replace(/\n/g, '<br>');

                const div = document.createElement('div');
                div.className = 'announcement';
                div.innerHTML = `
                    <div class="date">${item.date}</div>
                    <span class="title">${item.title}</span>
                    <div style="line-height: 1.5;">${contentHtml}</div>
                `;
                announcementsContainer.appendChild(div);
            });
        } else {
            announcementsContainer.innerHTML = '<div style="text-align:center; color: #888; padding: 20px;">目前沒有公告</div>';
        }
    }

    loadData();

</script>

</body>
</html>
